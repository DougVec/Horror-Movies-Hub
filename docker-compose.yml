services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: horrorhub
      POSTGRES_USER: horrorhub
      POSTGRES_PASSWORD: horrorhub
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  pgdata:
